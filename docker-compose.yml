services:

  db:
    image: postgres:16-alpine
    container_name: alia_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alia_db_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-alia_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: alia_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  django:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: alia_backend
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.production}
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-secret}
      DEBUG: ${DEBUG:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-aliabackend.kodevio.com,localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://aia.kodevio.com,https://aiaadmin.kodevio.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://aia.kodevio.com,https://aiaadmin.kodevio.com}
      DATABASE_URL: postgres://${POSTGRES_USER:-alia_db_user}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-alia_db}
      REDIS_URL: redis://redis:6379/0
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@kodevio.com}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_me}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-aed}
      BOOKING_PENDING_TTL_SECONDS: ${BOOKING_PENDING_TTL_SECONDS:-1200}
      SENTRY_DSN: ${SENTRY_DSN:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    networks:
      - backend

  celery_worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: alia_worker
    restart: unless-stopped
    command: celery -A config worker -l info
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.production}
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-secret}
      DEBUG: ${DEBUG:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-aliabackend.kodevio.com,localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://aia.kodevio.com,https://aiaadmin.kodevio.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://aia.kodevio.com,https://aiaadmin.kodevio.com}
      DATABASE_URL: postgres://${POSTGRES_USER:-alia_db_user}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-alia_db}
      REDIS_URL: redis://redis:6379/0
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      django:
        condition: service_healthy
    volumes:
      - media_volume:/app/media
    networks:
      - backend

  celery_beat:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: alia_beat
    restart: unless-stopped
    command: celery -A config beat -l info
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.production}
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-secret}
      DEBUG: ${DEBUG:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-aliabackend.kodevio.com,localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://aia.kodevio.com,https://aiaadmin.kodevio.com}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://aia.kodevio.com,https://aiaadmin.kodevio.com}
      DATABASE_URL: postgres://${POSTGRES_USER:-alia_db_user}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-alia_db}
      REDIS_URL: redis://redis:6379/0
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      django:
        condition: service_healthy
    networks:
      - backend

  backend-nginx:
    image: nginx:1.27-alpine
    container_name: alia_nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/static
      - media_volume:/media
    depends_on:
      - django
    networks:
      - backend
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.alia-backend-nginx.rule=Host(`aliabackend.kodevio.com`)
      - traefik.http.routers.alia-backend-nginx.entrypoints=websecure
      - traefik.http.routers.alia-backend-nginx.tls.certResolver=letsencrypt
      - traefik.docker.network=dokploy-network
      - traefik.http.services.alia-backend-nginx.loadbalancer.server.port=80
      # HTTP -> HTTPS redirect (so plain http:// requests return 301, not Traefik 404)
      - traefik.http.routers.alia-backend-http.rule=Host(`aliabackend.kodevio.com`)
      - traefik.http.routers.alia-backend-http.entrypoints=web
      - traefik.http.routers.alia-backend-http.middlewares=redirect-http-to-https
      - traefik.http.middlewares.redirect-http-to-https.redirectscheme.scheme=https
      - traefik.http.middlewares.redirect-http-to-https.redirectscheme.permanent=true

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  backend:
  dokploy-network:
    external: true